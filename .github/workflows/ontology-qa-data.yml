name: ontology-qa-full-experiment

on:
  push:
    branches:
      - research/ontology-korean-qa-20260621
    paths:
      - '.github/workflows/ontology-qa-data.yml'
      - 'research/ontology_korean_qa/run_experiment.py'
      - 'research/ontology_korean_qa/requirements.txt'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/ontology-qa-data.yml'
      - 'research/ontology_korean_qa/run_experiment.py'
      - 'research/ontology_korean_qa/requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      RESULT_DIR: research/ontology_korean_qa/results
      MODEL_NAME: intfloat/multilingual-e5-small
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ontology-korean-qa-20260621
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/ontology_korean_qa/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-e5-small-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/ontology_korean_qa/requirements.txt

      - name: Run KCL retrieval experiment
        run: python research/ontology_korean_qa/run_experiment.py

      - name: Record checksums
        run: |
          cd research/ontology_korean_qa/results
          sha256sum * > SHA256SUMS.txt

      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: kcl-ontology-retrieval-results
          path: research/ontology_korean_qa/results
          if-no-files-found: error
          retention-days: 30

      - name: Commit derived results to research branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ontology_korean_qa/results
          git diff --cached --quiet || git commit -m 'Add KCL experiment results [skip ci]'
          git push origin HEAD:research/ontology-korean-qa-20260621
